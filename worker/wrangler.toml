name = "kayuh"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The web app (web/dist) is served as static assets; /api/* goes to the Worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker routes /api/* itself and hands everything else to ASSETS.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kayuh"
# Created 21 Oct 2026 with `npx wrangler d1 create kayuh --location apac`.
database_id = "2541bc95-8c4e-4eb6-9896-53ee654b5723"
migrations_dir = "migrations"

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars locally):
#   ONEMAP_TOKEN  optional; OneMap search currently works without it

# Cloudflare Access (friends-only sign-in). Not secrets: the AUD tag identifies the Access
# application and the team domain serves its public signing keys. src/auth.ts verifies every
# request's Cf-Access-Jwt-Assertion against these.
[vars]
ACCESS_TEAM_DOMAIN = "shy-dust-1ef6.cloudflareaccess.com"
ACCESS_AUD = "923313ce29d3f36987be96ac8bf917576dd2d38bf34f89cb26a7a0236424619d"
