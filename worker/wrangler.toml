name = "kayuh"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The web app (web/dist) is served as static assets; /api/* goes to the Worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker routes /api/* itself and hands everything else to ASSETS.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kayuh"
# Created 21 Oct 2026 with `npx wrangler d1 create kayuh --location apac`.
database_id = "2541bc95-8c4e-4eb6-9896-53ee654b5723"
migrations_dir = "migrations"

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars locally):
#   ONEMAP_TOKEN  optional; OneMap search currently works without it
