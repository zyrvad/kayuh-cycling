<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17804F">
  <meta name="description" content="Kayuh: cycling routes in Singapore that stay on park connectors and end at legal bike parking.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent: the app draws under the status bar and home indicator instead of iOS adding solid bars.
       Everything that sits near an edge pads itself with env(safe-area-inset-*). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Kayuh</title>
  <!-- use-credentials: behind Cloudflare Access the manifest needs the sign-in cookie -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
