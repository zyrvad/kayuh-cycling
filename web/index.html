<!doctype html>
<html lang="en" class="splash-on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17804F">
  <meta name="description" content="Kayuh: cycling routes in Singapore that stay on park connectors and end at legal bike parking.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent: the app draws under the status bar and home indicator instead of iOS adding solid bars.
       Everything that sits near an edge pads itself with env(safe-area-inset-*). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Kayuh</title>
  <!-- use-credentials: behind Cloudflare Access the manifest needs the sign-in cookie -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html.splash-on { background: #17804F; }
    #splash { position: fixed; inset: 0; z-index: 100; background: #17804F; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      transition: opacity 240ms ease; }
    #splash .splash-mark { width: 96px; height: 96px; margin-top: -12vh; display: block; }
    #splash .splash-track { width: 120px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.28); margin-top: 28px; overflow: hidden; }
    #splash .splash-fill { height: 100%; width: 0; border-radius: 2px; background: #fff; transition: width 200ms linear; }
    @media (prefers-reduced-motion: reduce) { #splash, #splash .splash-fill { transition: none; } }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading Kayuh" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <!-- Mark: the live icon's white route line and start dot. The chosen logo's mark.svg replaces this inline SVG
         (white on transparent, viewBox cropped to the mark). -->
    <svg class="splash-mark" viewBox="56 88 408 304" aria-hidden="true">
      <path d="M96 352 C176 320 240 248 288 200 S392 136 424 128" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
      <circle cx="96" cy="352" r="34" fill="#FFFFFF"/>
    </svg>
    <div class="splash-track"><div class="splash-fill" id="splash-fill"></div></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
